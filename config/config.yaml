# 智能药盒助手配置文件

# API配置
api:
  # 选择大模型: openai, baidu, xunfei
  llm_provider: "openai"
  openai_api_key: "your-api-key-here"
  openai_model: "gpt-4-vision"
  baidu_api_key: "your-baidu-key"
  baidu_secret_key: "your-baidu-secret"
  xunfei_api_key: "your-xunfei-key"

# 图像处理配置
image:
  camera_index: 0
  image_width: 1280
  image_height: 720
  quality: 95
  save_path: "data/medicine_images"

# OCR配置
ocr:
  use_paddleocr: true
  language: ["ch", "en"]
  use_gpu: false

# 数据库配置
database:
  type: "sqlite"
  path: "data/medicine_info.db"
  csv_export_path: "data/medicine_info.csv"

# 提醒配置
reminder:
  enable_popup: true
  enable_voice: true
  reminder_advance_minutes: 10
  timezone: "Asia/Shanghai"

# 语音配置
voice:
  engine: "pyttsx3"
  rate: 150
  volume: 0.9
  language: "zh"

# 行为监测配置
behavior:
  enable_monitoring: true
  detection_model: "yolov8m"
  confidence_threshold: 0.5
  save_logs: true
  log_path: "data/logs"

# 日志配置
logging:
  level: "INFO"
  log_file: "logs/app.log"
  max_file_size: 10485760  # 10MB

# UI配置
ui:
  theme: "light"
  font_size: 12
  window_width: 1200
  window_height: 800
